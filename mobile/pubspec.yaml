name: shopeespot
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: any
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^17.5.0
  intl: ^0.20.3
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: any
  build_runner: any
  mocktail: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"

